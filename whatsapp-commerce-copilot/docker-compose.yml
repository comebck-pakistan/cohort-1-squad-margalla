
services:
  postgres:
    image: postgres:16-alpine
    container_name: wcc-postgres
    environment:
      POSTGRES_DB: whatsapp_commerce
      POSTGRES_USER: wcc_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-wcc_dev_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wcc_user -d whatsapp_commerce"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: wcc-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  evolution-api:
    image: evoapicloud/evolution-api:latest
    container_name: wcc-evolution
    ports:
      - "8081:8080"
    environment:
      SERVER_PORT: 8080
      SERVER_URL: http://evolution-api:8080
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY:-evo-dev-key}
      DATABASE_CONNECTION_URI: postgresql://wcc_user:${POSTGRES_PASSWORD:-wcc_dev_password}@postgres:5432/evolution_db
      DATABASE_ENABLED: "true"
      DATABASE_PROVIDER: postgresql
      CACHE_REDIS_ENABLED: "true"
      CACHE_REDIS_URI: redis://redis:6379
      CACHE_REDIS_PREFIX_KEY: evolution
      CACHE_LOCAL_ENABLED: "false"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    volumes:
      - ./backend:/app
    container_name: wcc-backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://wcc_user:${POSTGRES_PASSWORD:-wcc_dev_password}@postgres:5432/whatsapp_commerce
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-dev-internal-token}
      AI_PROVIDER: ${AI_PROVIDER:-gemini}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash-lite}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-openai/gpt-4o-mini}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173,http://localhost:3000}
      BACKEND_URL: http://backend:8000
      GATEWAY_URL: http://gateway:3001
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  gateway:
    build:
      context: ./whatsapp-gateway
      dockerfile: Dockerfile
    container_name: wcc-gateway
    ports:
      - "3001:3001"
    environment:
      GATEWAY_PORT: 3001
      BACKEND_URL: http://backend:8000
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-dev-internal-token}
      EVOLUTION_API_URL: http://evolution-api:8080
      EVOLUTION_API_KEY: ${EVOLUTION_API_KEY:-evo-dev-key}
      EVOLUTION_WEBHOOK_URL: http://gateway:3001/webhook/evolution
      EVOLUTION_API_VERSION: "latest"
      MAX_INBOUND_AGE_SECONDS: ${MAX_INBOUND_AGE_SECONDS:-300}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      TRANSCRIPTION_MODEL: ${TRANSCRIPTION_MODEL:-gemini-2.5-flash}
      MAX_AUDIO_BYTES: ${MAX_AUDIO_BYTES:-10485760}
      TRANSCRIPTION_TIMEOUT_MS: ${TRANSCRIPTION_TIMEOUT_MS:-45000}
    depends_on:
      - backend
      - evolution-api
    restart: unless-stopped

volumes:
  postgres_data:
